<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly CS Activities Report — History</title>
<style>
  :root{
    --ink:#1B2A33;
    --ink-soft:#5B6B74;
    --line:#E1E7EA;
    --bg:#F4F7F8;
    --card:#FFFFFF;
    --brand:#14678C;
    --brand-soft:#E7F0F4;
    --done:#2FAE66; --done-bg:#E7F7EE;
    --progress:#4C5FD5; --progress-bg:#EAEBFC;
    --feedback:#DFA300; --feedback-bg:#FDF3DA;
    --open:#8B98A1; --open-bg:#EEF1F2;
    --testing:#C2570F; --testing-bg:#FBE9DC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg); color:var(--ink); padding:32px 16px;
  }
  .wrap{ max-width:840px; margin:0 auto; }

  .picker{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:14px; flex-wrap:wrap;
  }
  .picker .title{ font-size:13px; font-weight:700; color:var(--ink-soft); }
  select{
    font-family:inherit; font-size:14px; font-weight:600; color:var(--brand);
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; cursor:pointer;
  }

  .sheet{
    background:var(--card); border-radius:14px; border:1px solid var(--line);
    overflow:hidden; box-shadow:0 1px 3px rgba(20,103,140,0.06);
  }
  .header{ background:var(--brand); color:#fff; padding:28px 32px; }
  .header .eyebrow{
    font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    opacity:.8; margin:0 0 6px;
  }
  .header h1{ margin:0; font-size:22px; font-weight:600; }
  .header .range{ margin-top:4px; font-size:14px; opacity:.9; }

  .stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border-bottom:1px solid var(--line);
  }
  .stat{ background:var(--card); padding:18px 20px; }
  .stat .label{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin:0 0 6px;
  }
  .stat .value{ font-size:20px; font-weight:700; color:var(--ink); }
  .stat .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .body{ padding:8px 32px 28px; }

  .shop-block{ margin-top:24px; }
  .shop-title{
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; color:var(--brand); margin-bottom:8px;
  }
  .shop-title .count{
    font-weight:500; color:var(--ink-soft); text-transform:none; letter-spacing:0;
  }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); padding:6px 10px; border-bottom:1px solid var(--line);
  }
  th.num, td.num{ text-align:right; }
  td{ padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td{ border-bottom:none; }

  .task a{
    color:var(--ink); text-decoration:none; font-weight:500;
    border-bottom:1px solid var(--brand);
  }
  .task a:hover{ color:var(--brand); }
  .task .plain{ color:var(--ink); font-weight:500; }
  .who{ display:block; margin-top:3px; font-size:11px; color:var(--ink-soft); font-weight:500; }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:3px 8px; border-radius:999px; white-space:nowrap; margin-top:5px;
  }
  .badge.done{ background:var(--done-bg); color:var(--done); }
  .badge.progress{ background:var(--progress-bg); color:var(--progress); }
  .badge.feedback{ background:var(--feedback-bg); color:var(--feedback); }
  .badge.open{ background:var(--open-bg); color:var(--open); }
  .badge.testing{ background:var(--testing-bg); color:var(--testing); }
  .badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .totals{
    margin-top:26px; padding-top:18px; border-top:2px solid var(--ink);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .totals .label{ font-size:14px; font-weight:700; }
  .totals .value{ font-size:20px; font-weight:800; color:var(--brand); }

  .footer{
    padding:14px 32px 22px; font-size:11px; color:var(--ink-soft);
    border-top:1px solid var(--line); background:#FAFCFD;
  }

  .empty{ padding:40px 32px; text-align:center; color:var(--ink-soft); font-size:14px; }
</style>

const STATUS_LABELS = {
  done: "Done",
  progress: "In progress",
  feedback: "Needs feedback",
  open: "Not started",
  testing: "Testing on live"
};

function badgeHtml(status){
  if(!status) return "";
  const label = STATUS_LABELS[status] || status;
  return `<span class="badge ${status}"><span class="dot"></span>${label}</span>`;
}

function taskRowHtml(t){
  const titleHtml = t.link
    ? `<a href="${t.link}">${t.title}</a>`
    : `<span class="plain">${t.title}</span>`;
  const whoHtml = t.who ? `<span class="who">${t.who}</span>` : "";
  return `
    <tr>
      <td class="task">${titleHtml}${whoHtml}${badgeHtml(t.status)}</td>
      <td>${t.date}</td>
      <td class="num">${t.hrs}</td>
    </tr>`;
}

function shopBlockHtml(shop){
  return `
    <div class="shop-block">
      <div class="shop-title">${shop.name} <span class="count">— ${shop.hours} hrs</span></div>
      <table>
        <tr><th>Task</th><th>Date</th><th class="num">Hrs</th></tr>
        ${shop.tasks.map(taskRowHtml).join("")}
      </table>
    </div>`;
}

function renderWeek(key){
  const w = WEEKS[key];
  const el = document.getElementById('report');
  if(!w){
    el.innerHTML = `<div class="empty">No data for this week yet.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="header">
      <p class="eyebrow">Atryos DMCC · CS Activities Report</p>
      <h1>Weekly CS Activities — Marketing Task Time Log</h1>
      <p class="range">${w.range}</p>
    </div>
    <div class="stats">
      <div class="stat">
        <p class="label">Total hours logged</p>
        <p class="value">${w.stats.totalHours}</p>
        <p class="sub">${w.stats.totalHoursSub}</p>
      </div>
      <div class="stat">
        <p class="label">Mailbox count</p>
        <p class="value">${w.stats.mailbox}</p>
        <p class="sub">${w.stats.mailboxSub}</p>
      </div>
      <div class="stat">
        <p class="label">Shops covered</p>
        <p class="value">${w.stats.shopsCount}</p>
        <p class="sub">${w.stats.shopsList}</p>
      </div>
    </div>
    <div class="body">
      ${w.shops.map(shopBlockHtml).join("")}
      <div class="totals">
        <span class="label">Total hours this week</span>
        <span class="value">${w.stats.totalHours}</span>
      </div>
    </div>
    <div class="footer">${w.footer}</div>
  `;
}

function labelForKey(key){
  return WEEKS[key] ? WEEKS[key].range.replace("Monday, ", "").replace(/Sunday, [A-Za-z]+ /, "– ") : key;
}

async function init(){
  // Sync embedded weeks into shared storage so anyone opening this artifact sees the same history.
  for(const key of Object.keys(WEEKS)){
    try{
      await window.storage.set(`week:${key}`, JSON.stringify(WEEKS[key]), true);
    }catch(e){ /* non-fatal */ }
  }

  // Pull in any additional weeks that exist in shared storage but aren't hardcoded above yet.
  try{
    const listed = await window.storage.list('week:', true);
    if(listed && listed.keys){
      for(const k of listed.keys){
        const shortKey = k.replace('week:', '');
        if(!WEEKS[shortKey]){
          try{
            const res = await window.storage.get(k, true);
            if(res && res.value){ WEEKS[shortKey] = JSON.parse(res.value); }
          }catch(e){ /* skip */ }
        }
      }
    }
  }catch(e){ /* non-fatal */ }

  const keys = Object.keys(WEEKS).sort().reverse();
  const select = document.getElementById('weekSelect');
  select.innerHTML = keys.map(k => `<option value="${k}">${labelForKey(k)}</option>`).join("");
  select.addEventListener('change', (e) => renderWeek(e.target.value));

  renderWeek(keys[0]);
}

init();
